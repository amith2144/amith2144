<svg width="100%" height="100%" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Card Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10121e" />
      <stop offset="100%" stop-color="#0a0c13" />
    </linearGradient>

    <!-- Card Hairline Border -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d334d" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>

    <!-- Highlight Top Border -->
    <linearGradient id="cardTopGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Bullet Accent -->
    <linearGradient id="cyanBullet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <style>
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      fill: #f8fafc;
    }
    .card-meta {
      font-family: 'SF Mono', 'Geist Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 1.2px;
      font-weight: 600;
      fill: #818cf8;
    }
    .bullet-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .bullet-bold {
      font-weight: 600;
      fill: #cbd5e1;
    }
  </style>

  <!-- ==================== CARD 1: AGENTIC WORKFLOWS ==================== -->
  <g transform="translate(1, 10)">
    <!-- Outer Shell / Enclosure -->
    <rect x="0" y="0" width="286" height="220" rx="14" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
    <!-- Top Edge Highlight Glow -->
    <line x1="24" y1="0" x2="262" y2="0" stroke="url(#cardTopGlow)" stroke-width="1.5" />

    <!-- Icon Badge -->
    <rect x="22" y="22" width="38" height="38" rx="10" fill="#181b2d" stroke="#2b314e" stroke-width="1" />
    <!-- Agent / Brain / Nodes Icon -->
    <g transform="translate(30, 30)" stroke="#818cf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="11" cy="4" r="2.5" />
      <circle cx="4" cy="16" r="2.5" />
      <circle cx="18" cy="16" r="2.5" />
      <line x1="11" y1="6.5" x2="5.5" y2="13.5" />
      <line x1="11" y1="6.5" x2="16.5" y2="13.5" />
      <circle cx="11" cy="11" r="1" fill="#818cf8" />
    </g>

    <!-- Card Headers -->
    <text x="22" y="80" class="card-meta">PILLAR // 01</text>
    <text x="22" y="100" class="card-title">Agentic AI Workflows</text>

    <!-- Bullet Items -->
    <g transform="translate(22, 124)">
      <!-- Item 1 -->
      <circle cx="4" cy="4" r="2" fill="url(#cyanBullet)" />
      <text x="14" y="8" class="bullet-text"><tspan class="bullet-bold">Autonomous Loops:</tspan> Multi-agent orchestration</text>
      
      <!-- Item 2 -->
      <circle cx="4" cy="30" r="2" fill="url(#cyanBullet)" />
      <text x="14" y="34" class="bullet-text"><tspan class="bullet-bold">Tool Execution:</tspan> Deterministic API calling</text>
      
      <!-- Item 3 -->
      <circle cx="4" cy="56" r="2" fill="url(#cyanBullet)" />
      <text x="14" y="60" class="bullet-text"><tspan class="bullet-bold">Reliability:</tspan> Self-correcting state machines</text>
    </g>
  </g>

  <!-- ==================== CARD 2: RAG & SEMANTIC SEARCH ==================== -->
  <g transform="translate(307, 10)">
    <!-- Outer Shell / Enclosure -->
    <rect x="0" y="0" width="286" height="220" rx="14" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
    <line x1="24" y1="0" x2="262" y2="0" stroke="url(#cardTopGlow)" stroke-width="1.5" />

    <!-- Icon Badge -->
    <rect x="22" y="22" width="38" height="38" rx="10" fill="#181b2d" stroke="#2b314e" stroke-width="1" />
    <!-- Vector / Search Icon -->
    <g transform="translate(30, 30)" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="11" cy="6" rx="8" ry="3" />
      <path d="M3 6v5c0 1.66 3.58 3 8 3s8-1.34 8-3V6" />
      <path d="M3 11v5c0 1.66 3.58 3 8 3s8-1.34 8-3v-5" />
    </g>

    <!-- Card Headers -->
    <text x="22" y="80" class="card-meta">PILLAR // 02</text>
    <text x="22" y="100" class="card-title">Enterprise RAG &amp; Vector</text>

    <!-- Bullet Items -->
    <g transform="translate(22, 124)">
      <!-- Item 1 -->
      <circle cx="4" cy="4" r="2" fill="url(#cyanBullet)" />
      <text x="14" y="8" class="bullet-text"><tspan class="bullet-bold">Hybrid Search:</tspan> pgvector + dense retrieval</text>
      
      <!-- Item 2 -->
      <circle cx="4" cy="30" r="2" fill="url(#cyanBullet)" />
      <text x="14" y="34" class="bullet-text"><tspan class="bullet-bold">Context Engineering:</tspan> Re-ranking &amp; filtering</text>
      
      <!-- Item 3 -->
      <circle cx="4" cy="56" r="2" fill="url(#cyanBullet)" />
      <text x="14" y="60" class="bullet-text"><tspan class="bullet-bold">Data Pipelines:</tspan> Sub-second ingestion speed</text>
    </g>
  </g>

  <!-- ==================== CARD 3: PRODUCTION INFRASTRUCTURE ==================== -->
  <g transform="translate(613, 10)">
    <!-- Outer Shell / Enclosure -->
    <rect x="0" y="0" width="286" height="220" rx="14" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
    <line x1="24" y1="0" x2="262" y2="0" stroke="url(#cardTopGlow)" stroke-width="1.5" />

    <!-- Icon Badge -->
    <rect x="22" y="22" width="38" height="38" rx="10" fill="#181b2d" stroke="#2b314e" stroke-width="1" />
    <!-- Server / Pipeline Icon -->
    <g transform="translate(30, 30)" stroke="#10b981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="3" y="3" width="16" height="6" rx="1.5" />
      <rect x="3" y="13" width="16" height="6" rx="1.5" />
      <circle cx="6" cy="6" r="1" fill="#10b981" />
      <circle cx="6" cy="16" r="1" fill="#10b981" />
      <line x1="14" y1="6" x2="16" y2="6" />
      <line x1="14" y1="16" x2="16" y2="16" />
    </g>

    <!-- Card Headers -->
    <text x="22" y="80" class="card-meta">PILLAR // 03</text>
    <text x="22" y="100" class="card-title">Production Backends</text>

    <!-- Bullet Items -->
    <g transform="translate(22, 124)">
      <!-- Item 1 -->
      <circle cx="4" cy="4" r="2" fill="url(#cyanBullet)" />
      <text x="14" y="8" class="bullet-text"><tspan class="bullet-bold">Core Stack:</tspan> Async FastAPI, Python, Redis</text>
      
      <!-- Item 2 -->
      <circle cx="4" cy="30" r="2" fill="url(#cyanBullet)" />
      <text x="14" y="34" class="bullet-text"><tspan class="bullet-bold">Containerized:</tspan> Dockerized microservices</text>
      
      <!-- Item 3 -->
      <circle cx="4" cy="56" r="2" fill="url(#cyanBullet)" />
      <text x="14" y="60" class="bullet-text"><tspan class="bullet-bold">Zero-Downtime:</tspan> High-throughput reliability</text>
    </g>
  </g>
</svg>
