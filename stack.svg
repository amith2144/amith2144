<svg width="100%" height="100%" viewBox="0 0 900 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111c" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>
    <linearGradient id="stackBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d334d" />
      <stop offset="50%" stop-color="#1e2235" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>
  </defs>

  <style>
    .cat-title {
      font-family: 'SF Mono', 'Geist Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      font-weight: 600;
      fill: #818cf8;
    }
    .pill-bg {
      fill: #151827;
      stroke: #252a3f;
      stroke-width: 1;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      fill: #e2e8f0;
    }
  </style>

  <!-- Enclosure -->
  <rect x="1" y="1" width="898" height="188" rx="14" fill="url(#stackBg)" stroke="url(#stackBorder)" stroke-width="1.2" />

  <!-- ================= ROW 1: CORE & BACKEND ================= -->
  <g transform="translate(24, 20)">
    <text x="0" y="20" class="cat-title">01 // CORE BACKEND &amp; DATA</text>
    <g transform="translate(220, 4)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <rect width="104" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#38bdf8" />
        <text x="22" y="17" class="pill-text">Python 3.12+</text>
      </g>
      <!-- FastAPI -->
      <g transform="translate(112, 0)">
        <rect width="78" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#10b981" />
        <text x="22" y="17" class="pill-text">FastAPI</text>
      </g>
      <!-- PostgreSQL -->
      <g transform="translate(198, 0)">
        <rect width="98" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#6366f1" />
        <text x="22" y="17" class="pill-text">PostgreSQL</text>
      </g>
      <!-- Redis -->
      <g transform="translate(304, 0)">
        <rect width="68" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#f43f5e" />
        <text x="22" y="17" class="pill-text">Redis</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(380, 0)">
        <rect width="96" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#3b82f6" />
        <text x="22" y="17" class="pill-text">TypeScript</text>
      </g>
      <!-- React / Next -->
      <g transform="translate(484, 0)">
        <rect width="128" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#a855f7" />
        <text x="22" y="17" class="pill-text">React / Next.js</text>
      </g>
    </g>
  </g>

  <line x1="24" y1="72" x2="876" y2="72" stroke="#1c2033" stroke-width="1" />

  <!-- ================= ROW 2: AI & COGNITIVE ================= -->
  <g transform="translate(24, 82)">
    <text x="0" y="20" class="cat-title">02 // AI &amp; AGENT PLATFORMS</text>
    <g transform="translate(220, 4)">
      <!-- LangGraph -->
      <g transform="translate(0, 0)">
        <rect width="148" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#818cf8" />
        <text x="22" y="17" class="pill-text">LangGraph / Chains</text>
      </g>
      <!-- pgvector -->
      <g transform="translate(156, 0)">
        <rect width="144" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#38bdf8" />
        <text x="22" y="17" class="pill-text">pgvector &amp; Hybrid</text>
      </g>
      <!-- LLM APIs -->
      <g transform="translate(308, 0)">
        <rect width="142" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#10b981" />
        <text x="22" y="17" class="pill-text">OpenAI / Claude</text>
      </g>
      <!-- Semantic Evaluation -->
      <g transform="translate(458, 0)">
        <rect width="168" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#f59e0b" />
        <text x="22" y="17" class="pill-text">Evaluation &amp; Telemetry</text>
      </g>
    </g>
  </g>

  <line x1="24" y1="130" x2="876" y2="130" stroke="#1c2033" stroke-width="1" />

  <!-- ================= ROW 3: INFRASTRUCTURE ================= -->
  <g transform="translate(24, 140)">
    <text x="0" y="20" class="cat-title">03 // INFRASTRUCTURE &amp; OPS</text>
    <g transform="translate(220, 4)">
      <!-- Docker -->
      <g transform="translate(0, 0)">
        <rect width="78" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#0284c7" />
        <text x="22" y="17" class="pill-text">Docker</text>
      </g>
      <!-- CI/CD -->
      <g transform="translate(86, 0)">
        <rect width="134" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#10b981" />
        <text x="22" y="17" class="pill-text">GitHub CI/CD</text>
      </g>
      <!-- Linux -->
      <g transform="translate(228, 0)">
        <rect width="90" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#f59e0b" />
        <text x="22" y="17" class="pill-text">Linux Env</text>
      </g>
      <!-- REST & Async -->
      <g transform="translate(326, 0)">
        <rect width="158" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#818cf8" />
        <text x="22" y="17" class="pill-text">REST / Event-Driven</text>
      </g>
      <!-- Vercel -->
      <g transform="translate(492, 0)">
        <rect width="80" height="26" rx="6" class="pill-bg" />
        <circle cx="12" cy="13" r="3" fill="#e2e8f0" />
        <text x="22" y="17" class="pill-text">Vercel</text>
      </g>
    </g>
  </g>
</svg>
