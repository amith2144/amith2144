<svg width="100%" height="100%" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b12" />
      <stop offset="50%" stop-color="#0d0f1b" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>

    <!-- Ambient Glow Left -->
    <radialGradient id="glowIndigo" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Glow Right -->
    <radialGradient id="glowCyan" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Hairline Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Dot Matrix Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseRadar {
      0% { r: 3.5px; opacity: 1; }
      50% { r: 7.5px; opacity: 0.3; }
      100% { r: 3.5px; opacity: 1; }
    }
    @keyframes pulseRing {
      0% { r: 4px; opacity: 0.8; stroke-width: 1px; }
      100% { r: 12px; opacity: 0; stroke-width: 0.5px; }
    }
    .radar-dot {
      animation: pulseRadar 2.4s ease-in-out infinite;
    }
    .radar-ring {
      animation: pulseRing 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .mono-label {
      font-family: 'SF Mono', 'Geist Mono', 'JetBrains Mono', 'Consolas', monospace;
      font-size: 10px;
      letter-spacing: 1.8px;
      font-weight: 600;
    }
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Geist Sans', Roboto, sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -1.2px;
    }
    .hero-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Geist Sans', Roboto, sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .hero-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      letter-spacing: 0.1px;
      line-height: 1.6;
    }
    .telemetry-title {
      font-family: 'SF Mono', 'Geist Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.2px;
      font-weight: 600;
      fill: #818cf8;
    }
    .telemetry-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #e2e8f0;
    }
  </style>

  <!-- Base Enclosure -->
  <rect x="1" y="1" width="898" height="318" rx="16" fill="url(#bgGradient)" />
  <rect x="1" y="1" width="898" height="318" rx="16" fill="url(#glowIndigo)" />
  <rect x="1" y="1" width="898" height="318" rx="16" fill="url(#glowCyan)" />
  <rect x="1" y="1" width="898" height="318" rx="16" fill="url(#dotGrid)" />
  <rect x="1" y="1" width="898" height="318" rx="16" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Top Status Pill (Machined Island) -->
  <g transform="translate(42, 34)">
    <rect width="360" height="28" rx="14" fill="#131625" fill-opacity="0.8" stroke="#272b40" stroke-width="1" />
    
    <!-- Pulsing Radar Indicator -->
    <circle cx="16" cy="14" r="7" fill="none" stroke="#10b981" class="radar-ring" />
    <circle cx="16" cy="14" r="3.5" fill="#10b981" class="radar-dot" />
    
    <text x="32" y="17.5" fill="#10b981" class="mono-label">AVAILABLE FOR ARCHITECTURE &amp; CONTRACTS</text>
  </g>

  <!-- Location / Timezone Indicator (Top Right) -->
  <g transform="translate(680, 34)">
    <rect width="178" height="28" rx="14" fill="#131625" fill-opacity="0.6" stroke="#272b40" stroke-width="1" />
    <circle cx="16" cy="14" r="3" fill="#64748b" />
    <text x="28" y="17.5" fill="#94a3b8" class="mono-label">IST (UTC +5:30) · REMOTE</text>
  </g>

  <!-- Main Hero Block -->
  <g transform="translate(42, 114)">
    <!-- Name -->
    <text x="0" y="0" fill="url(#titleGrad)" class="hero-title">Amith Gerri</text>
    
    <!-- Role / Specialty -->
    <text x="0" y="30" fill="url(#accentGrad)" class="hero-sub">AI SYSTEMS ARCHITECT &amp; PRODUCTION BACKEND ENGINEER</text>
    
    <!-- Direct Executive Value Proposition -->
    <text x="0" y="60" fill="#94a3b8" class="hero-desc">Designing enterprise-grade autonomous agent systems, resilient semantic pipelines, and high-throughput production backends.</text>
  </g>

  <!-- Bottom Telemetry Divider -->
  <line x1="42" y1="230" x2="858" y2="230" stroke="#1f2438" stroke-width="1" />

  <!-- Telemetry Row: 3 Architecture Columns -->
  <!-- Col 1 -->
  <g transform="translate(42, 248)">
    <text x="0" y="12" class="telemetry-title">01 // AUTONOMOUS AI</text>
    <text x="0" y="32" class="telemetry-value">Multi-Agent Loops &amp; Tool Orchestration</text>
  </g>

  <!-- Col 2 -->
  <g transform="translate(325, 248)">
    <text x="0" y="12" class="telemetry-title">02 // DATA &amp; RETRIEVAL</text>
    <text x="0" y="32" class="telemetry-value">Hybrid Search · pgvector · RAG Pipelines</text>
  </g>

  <!-- Col 3 -->
  <g transform="translate(615, 248)">
    <text x="0" y="12" class="telemetry-title">03 // CORE INFRASTRUCTURE</text>
    <text x="0" y="32" class="telemetry-value">Async FastAPI · Docker · Telemetry</text>
  </g>
</svg>
